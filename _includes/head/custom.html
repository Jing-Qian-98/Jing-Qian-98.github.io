<link rel="icon" type="image/png" href="{{ base_path }}/images/Site_logo2.png" sizes="16x16">
<link rel="manifest" href="{{ base_path }}/images/manifest.json?v=M44lzPylqQ">
<link rel="mask-icon" href="{{ base_path }}/images/safari-pinned-tab.svg?v=M44lzPylqQ" color="#000000">
<link rel="shortcut icon" href="/images/favicon.ico?v=M44lzPylqQ">
<meta name="msapplication-TileColor" content="#000000">
<meta name="msapplication-TileImage" content="{{ base_path }}/images/mstile-144x144.png?v=M44lzPylqQ">
<meta name="msapplication-config" content="{{ base_path }}/images/browserconfig.xml?v=M44lzPylqQ">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>

<!-- Mobile navigation: show every section link instead of hiding them behind the hamburger menu -->
<style>
  @media (max-width: 924px) {
    .greedy-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      min-width: 0;
    }
    .greedy-nav button { display: none !important; }
    .greedy-nav .visible-links,
    .greedy-nav .hidden-links,
    .greedy-nav .hidden-links.hidden {
      display: contents !important;
      visibility: visible !important;
    }
    .greedy-nav .hidden-links:before,
    .greedy-nav .hidden-links:after { display: none !important; }
    .greedy-nav .masthead__menu-item {
      display: block;
      float: none;
    }
    .greedy-nav .masthead__menu-item--lg {
      flex-basis: 100%;
      padding-right: 0;
      margin-bottom: 0.25em;
    }
    .greedy-nav .masthead__menu-item--lg a { margin: 0; }
    .greedy-nav .masthead__menu-item:not(.masthead__menu-item--lg) a {
      margin: 0 1.25em 0 0;
      padding: 0.25em 0;
      font-size: 0.95em;
      color: #6f777d;
    }
    .greedy-nav .masthead__menu-item:not(.masthead__menu-item--lg) a:before { display: none; }
  }
</style>

<!-- end custom head snippets -->
